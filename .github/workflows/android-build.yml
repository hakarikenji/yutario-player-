name: Android Build

# Builds the debug APK for Yutario Player:
#   Bun install → Vite web build → manual Android toolchain (licenses accepted
#   non-interactively) → Capacitor sync → Gradle assembleDebug
# Artifacts: app-debug.apk ( downloadable from the workflow run page )
#
# NOTE: android-actions/setup-android is intentionally NOT used — its built-in
# license acceptance hangs on the interactive y/N prompt. We install
# commandline-tools manually and accept every license with `yes |` ourselves.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Pin the commandline-tools build (stable canonical URL from dl.google.com).
  CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Operator keys (Hakari Studio) are injected at build time from repo
      # secrets — listeners never provide keys. The key rides inside the
      # built dist/ that cap sync copies into the APK.
      - name: Bake operator API keys into the web build
        env:
          VITE_JAMENDO_CLIENT_ID: ${{ secrets.VITE_JAMENDO_CLIENT_ID }}
        run: bun run build

      - name: Setup Java 21 (Capacitor 7 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android commandline-tools (manual, isolated SDK root)
        shell: bash
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL "$CMDLINE_TOOLS_URL" -o "$RUNNER_TEMP/clt.zip"
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses (non-interactive)
        shell: bash
        run: |
          # `|| true` swallows the expected SIGPIPE from `yes` when sdkmanager
          # closes stdin (runners use -o pipefail). Genuine license failures
          # surface loudly in the SDK install step that follows.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses --sdk_root="$ANDROID_HOME" > /dev/null || true
          echo "All Android SDK licenses accepted."

      - name: Install SDK packages (platform 35 + build-tools)
        shell: bash
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed | head -8

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Enforce compileSdk 35 (Capacitor 7 requirement)
        run: |
          cd android
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' variables.gradle
          grep -E 'compileSdkVersion|targetSdkVersion' variables.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yutario-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
